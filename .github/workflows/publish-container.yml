name: Publish CPU container

on:
  push:
    tags:
      - "cpu-sha-*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate source tag
        shell: bash
        run: |
          expected="cpu-sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "::error::Expected tag ${expected}, got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish CPU image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:cpu-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Voicebox CPU container
          cache-from: type=gha,scope=voicebox-cpu-amd64
          cache-to: type=gha,mode=max,scope=voicebox-cpu-amd64

      - name: Verify published manifest
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:cpu-sha-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "::error::Build did not return an image digest"
            exit 1
          fi

          manifest="$(docker buildx imagetools inspect "${IMAGE_REF}")"
          printf '%s\n' "${manifest}"
          if ! grep -Fq "Digest: ${IMAGE_DIGEST}" <<< "${manifest}"; then
            echo "::error::Registry manifest digest did not match build output"
            exit 1
          fi

          echo "Published image: \`${IMAGE_REF}@${IMAGE_DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify CPU-only PyTorch runtime
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:cpu-sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "${IMAGE_REF}" -c \
            "import torch; hip = getattr(torch.version, 'hip', None); assert torch.version.cuda is None and hip is None, f'Unexpected GPU runtime: CUDA={torch.version.cuda}, HIP={hip}'; print('CPU-only PyTorch', torch.__version__)"
