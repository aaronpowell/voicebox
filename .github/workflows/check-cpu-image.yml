name: Check CPU image dependencies

on:
  push:
    branches:
      - aaronpowell-fix-ivy-bridge-pedalboard

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install x86 emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
      - name: Build image without publishing
        run: docker build --tag voicebox-cpu-check .
      - name: Inspect installed dependencies
        run: |
          docker run --rm --entrypoint python voicebox-cpu-check -c \
            'import importlib.metadata as m; import numpy, numba, torch, torchaudio; print("numpy", numpy.__version__); print("numba", numba.__version__); print("torch", torch.__version__); print("torchaudio", torchaudio.__version__); print("torchaudio requirements", m.requires("torchaudio")); print("pedalboard", m.version("pedalboard")); assert numpy.__version__.startswith("1."); assert numba.__version__.startswith("0.60."); assert torch.__version__.split("+")[0] == torchaudio.__version__.split("+")[0]'
          docker run --rm --entrypoint python voicebox-cpu-check -m pip check
      - name: Check startup and inference operations under Ivy Bridge
        run: |
          timeout --kill-after=5s 300s docker run --rm --ulimit core=0:0 --network none \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e PYTHONPATH=/app \
            -v /usr/bin/qemu-x86_64-static:/qemu:ro \
            -v "$GITHUB_WORKSPACE/scripts/test_ivy_bridge_image.py:/smoke.py:ro" \
            --entrypoint /qemu voicebox-cpu-check -cpu IvyBridge \
            /usr/local/bin/python -X faulthandler /smoke.py
