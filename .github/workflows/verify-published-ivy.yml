name: Verify published Ivy Bridge image

on:
  push:
    branches:
      - aaronpowell-fix-ivy-bridge-pedalboard

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install x86 emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
      - name: Verify published image
        env:
          IMAGE_REF: ghcr.io/aaronpowell/voicebox@sha256:5b35c49a112c0401d56df62ff945afcc06e72bf8d5f3a879841a825140bd9e04
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker run --rm --entrypoint python "$IMAGE_REF" -c \
            'import importlib.metadata as m; print("pedalboard", m.version("pedalboard")); print("torch", m.version("torch")); print("torchaudio", m.version("torchaudio")); print("numpy", m.version("numpy")); assert m.version("pedalboard") == "0.9.26"'
          timeout --kill-after=5s 300s docker run --rm --ulimit core=0:0 --network none \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e PYTHONPATH=/app \
            -v /usr/bin/qemu-x86_64-static:/qemu:ro \
            -v "$GITHUB_WORKSPACE/scripts/test_ivy_bridge_image.py:/smoke.py:ro" \
            --entrypoint /qemu "$IMAGE_REF" -cpu IvyBridge \
            /usr/local/bin/python -X faulthandler /smoke.py
