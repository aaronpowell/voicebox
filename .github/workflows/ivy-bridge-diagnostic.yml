name: Ivy Bridge diagnostic

on:
  push:
    branches:
      - aaronpowell-fix-ivy-bridge-pedalboard

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
      - name: Compare original and portable wheel
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/aaronpowell/voicebox@sha256:fee13c47e523c2aa004ab66caab4e20f36b0e4b32a61582c2bd5833297fedc1d"
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/ivy"
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/ivy" pedalboard==0.9.26
          python -m zipfile -e "$RUNNER_TEMP/ivy/"*.whl "$RUNNER_TEMP/ivy/candidate"
          chmod -R a+rX "$RUNNER_TEMP/ivy"
          common=(--rm --ulimit core=0:0 --network none -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -v /usr/bin/qemu-x86_64-static:/qemu:ro -v "$RUNNER_TEMP/ivy:/test" --entrypoint /qemu "$image" -cpu IvyBridge)
          set +e
          timeout --kill-after=5s 120s docker run "${common[@]}" -d in_asm -D /test/original-trace /usr/local/bin/python -X faulthandler -c 'import pedalboard; print(pedalboard.__version__)'
          status=$?
          set -e
          echo "Original wheel emulator exit status: $status"
          tail -n 100 "$RUNNER_TEMP/ivy/original-trace"
          if [[ "$status" -ne 132 ]]; then
            echo "::error::Expected original wheel to exit with SIGILL (132), got $status"
            exit 1
          fi
          timeout --kill-after=5s 120s docker run -e PYTHONPATH=/test/candidate "${common[@]}" /usr/local/bin/python -X faulthandler -c 'import pedalboard; print("Portable candidate:", pedalboard.__version__)'
