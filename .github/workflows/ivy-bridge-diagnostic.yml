name: Ivy Bridge diagnostic

on:
  push:
    branches:
      - aaronpowell-fix-ivy-bridge-pedalboard

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static gdb
      - name: Compare original and portable wheel
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/aaronpowell/voicebox@sha256:fee13c47e523c2aa004ab66caab4e20f36b0e4b32a61582c2bd5833297fedc1d"
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/ivy"
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/ivy" pedalboard==0.9.26
          python -m zipfile -e "$RUNNER_TEMP/ivy/"*.whl "$RUNNER_TEMP/ivy/candidate"
          chmod -R a+rX "$RUNNER_TEMP/ivy"
          docker run -d --name ivy-sigill --network host --ulimit core=0:0 \
            -e OPENBLAS_NUM_THREADS=1 -v /usr/bin/qemu-x86_64-static:/qemu:ro \
            --entrypoint /qemu "$image" -cpu IvyBridge -g 1234 \
            /usr/local/bin/python -c 'import pedalboard'
          trap 'docker rm -f ivy-sigill >/dev/null 2>&1 || true' EXIT
          sleep 3
          timeout --kill-after=5s 90s gdb -q -batch \
            -ex 'target remote 127.0.0.1:1234' -ex 'continue' \
            -ex 'x/8i $pc' -ex 'info registers' | tee "$RUNNER_TEMP/ivy/gdb.txt"
          grep -q 'SIGILL' "$RUNNER_TEMP/ivy/gdb.txt"
          docker rm -f ivy-sigill
          trap - EXIT
          common=(--rm --ulimit core=0:0 --network none -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -v /usr/bin/qemu-x86_64-static:/qemu:ro -v "$RUNNER_TEMP/ivy:/test" -v "$GITHUB_WORKSPACE/scripts/test_ivy_bridge_image.py:/smoke.py:ro" --entrypoint /qemu "$image" -cpu IvyBridge)
          timeout --kill-after=5s 120s docker run -e PYTHONPATH=/test/candidate "${common[@]}" /usr/local/bin/python -X faulthandler -c 'import pedalboard; print("Portable candidate:", pedalboard.__version__)'
          timeout --kill-after=5s 300s docker run -e PYTHONPATH=/test/candidate:/app "${common[@]}" /usr/local/bin/python -X faulthandler /smoke.py
      - name: Build and verify the full image without publishing
        timeout-minutes: 35
        run: |
          docker build --tag voicebox-ivy-candidate .
          timeout --kill-after=5s 300s docker run --rm --ulimit core=0:0 --network none \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e PYTHONPATH=/app \
            -v /usr/bin/qemu-x86_64-static:/qemu:ro \
            -v "$GITHUB_WORKSPACE/scripts/test_ivy_bridge_image.py:/smoke.py:ro" \
            --entrypoint /qemu voicebox-ivy-candidate -cpu IvyBridge \
            /usr/local/bin/python -X faulthandler /smoke.py
